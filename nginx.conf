# ─────────────────────────────────────────────────────────────────────────────
# Sambid — Nginx production config (single-domain: API under /api)
#   Frontend : https://sambid.co + https://www.sambid.co  (React build)
#   Backend  : https://sambid.co/api → Express on 127.0.0.1:8000
#
# Place at: /etc/nginx/sites-available/sambid
# Enable:   sudo ln -s /etc/nginx/sites-available/sambid /etc/nginx/sites-enabled/
# SSL:      sudo certbot --nginx -d sambid.co -d www.sambid.co
# Reload:   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sambid.co www.sambid.co;
    return 301 https://$host$request_uri;
}

# Redirect www → non-www (HTTPS). Without this, sambid.co and www.sambid.co
# both serve identical content as two separate crawlable URLs — Google
# discovers both and has to consolidate them via canonical tags, which
# wastes crawl budget and can suppress indexing. A hard redirect means it
# never sees www as a separate page to begin with.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sambid.co;

    ssl_certificate     /etc/letsencrypt/live/sambid.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sambid.co/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sambid.co$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sambid.co;

    # ── SSL — managed by Certbot ─────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/sambid.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sambid.co/privkey.pem;
    # options-ssl-nginx.conf already sets ssl_protocols/ssl_ciphers - an
    # explicit ssl_protocols line here was redundant and caused nginx's
    # "duplicate value" warnings (harmless, but noisy).
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"     always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.paypal.com https://*.stripe.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' wss://sambid.co wss://www.sambid.co https://*.paypal.com https://*.stripe.com; frame-src https://*.paypal.com https://*.stripe.com https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com;" always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/woff2;

    # ── Frontend — serve React build ─────────────────────────────────────────
    root  /var/www/sambid/frontend/dist;
    index index.html;

    # Long-lived cache for hashed Vite assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── API proxy → Express backend ──────────────────────────────────────────
    location /api {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # AI endpoints (risk assessment, deep analysis, chat) read multiple PDFs
        # and make long model calls — 60s caused 504s on real solicitations.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Feature/media uploads accept videos up to 200MB (multer limit) — nginx
        # must allow at least that much or uploads die with 413.
        client_max_body_size 200m;
    }

    # ── Socket.IO proxy — long-lived WebSocket connections ───────────────────
    location /socket.io {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # 1 hour — keep WebSocket alive
        proxy_send_timeout 3600s;
    }

    # ── Uploaded files (feature images, documents) ───────────────────────────
    # ^~ is REQUIRED: without it the regex location for *.jpg/png above wins
    # and nginx looks for uploads inside frontend/dist → 404 for every image.
    location ^~ /uploads {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        expires            7d;
    }

    # ── Health check endpoint (no logging) ───────────────────────────────────
    location /health {
        proxy_pass         http://127.0.0.1:8000/health;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── SPA fallback — all routes → index.html ───────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
