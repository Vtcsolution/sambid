# ─────────────────────────────────────────────────────────────────────────────
# Sambid — Nginx production config
#   Frontend : https://sambid.com  (+ www.sambid.com → redirects to apex)
#   Backend  : https://api.sambid.com → Express on 127.0.0.1:8000
#
# Place at: /etc/nginx/sites-available/sambid
# Enable:   sudo ln -s /etc/nginx/sites-available/sambid /etc/nginx/sites-enabled/
# SSL:      sudo certbot --nginx -d sambid.com -d www.sambid.com -d api.sambid.com
# Reload:   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect (all hosts) ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name sambid.com www.sambid.com api.sambid.com;
    return 301 https://$host$request_uri;
}

# ── www → apex redirect (keeps a single canonical origin for CORS/SEO) ──────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sambid.com;

    ssl_certificate     /etc/letsencrypt/live/sambid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sambid.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sambid.com$request_uri;
}

# ── Frontend — sambid.com serves the React build ────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sambid.com;

    ssl_certificate     /etc/letsencrypt/live/sambid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sambid.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"     always;
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.paypal.com https://*.stripe.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.sambid.com wss://api.sambid.com https://*.paypal.com https://*.stripe.com; frame-src https://*.paypal.com https://*.stripe.com;" always;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/woff2;

    # ── Serve React build ─────────────────────────────────────────────────────
    root  /var/www/sambid/frontend/dist;
    index index.html;

    # Long-lived cache for hashed Vite assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA fallback — all routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Backend API — api.sambid.com proxies to Express ─────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sambid.com;

    ssl_certificate     /etc/letsencrypt/live/sambid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sambid.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;

    client_max_body_size 10m;

    # ── API routes ────────────────────────────────────────────────────────────
    location /api {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Socket.IO — long-lived WebSocket connections ─────────────────────────
    location /socket.io {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # 1 hour — keep WebSocket alive
        proxy_send_timeout 3600s;
    }

    # ── Uploaded files (feature images, documents) ───────────────────────────
    location /uploads {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        expires            7d;
    }

    # ── Health check (no logging) ─────────────────────────────────────────────
    location /health {
        proxy_pass         http://127.0.0.1:8000/health;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # Root of api subdomain → backend status JSON
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
    }
}
